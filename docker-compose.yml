services:
  db:
    image: mariadb:11
    container_name: fashion_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: fashion_catalog_db
      MARIADB_USER: fashion_user
      MARIADB_PASSWORD: fashion_pass
      MARIADB_ROOT_PASSWORD: root_pass
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"   # host 3307 -> container 3306 (biar nggak bentrok XAMPP)

  app:
    build: .
    container_name: fashion_api
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"     # host 8080 -> apache 80
    environment:
      CI_ENVIRONMENT: development
    volumes:
      - .:/var/www/html   # live sync (opsional, enak pas dev)
      - ./writable:/var/www/html/writable
volumes:
  db_data:
